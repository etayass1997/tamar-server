<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#B85C38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="תמר">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest.json">
<title>תמר במטבח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #FDFAF3;
    --surface:     #F5EDD8;
    --surface2:    #EDE0C2;
    --border:      #DEC99A;
    --border-soft: #EBD9B0;
    --accent:      #B85C38;
    --accent-dark: #8F4428;
    --accent-light:#E8956D;
    --green:       #6B8F4A;
    --green-bg:    #EEF4E6;
    --text:        #3D2B1F;
    --text-dim:    #8B6B4F;
    --text-muted:  #B89E85;
    --bubble-user: #F0E4CC;
    --bubble-ai:   #FFFFFF;
    --shadow:      0 2px 12px rgba(61,43,31,.10);
    --radius:      16px;
    --font:        'Heebo', sans-serif;
    --sidebar-w:   220px;
    --header-h:    64px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); direction: rtl; overflow: hidden; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ── HEADER ── */
  .header {
    height: var(--header-h);
    background: var(--bg);
    border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
    box-shadow: 0 1px 8px rgba(61,43,31,.06);
    z-index: 10;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #D4813A);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 2px 8px rgba(184,92,56,.3);
  }
  .header-name { font-size: 18px; font-weight: 700; color: var(--text); }
  .header-sub  { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .kb-badge {
    font-size: 11px; padding: 4px 10px; border-radius: 20px;
    background: var(--green-bg); color: var(--green);
    border: 1px solid #C5DDB0; font-weight: 500;
    display: none; align-items: center; gap: 5px;
  }
  .kb-badge.visible { display: inline-flex; }

  /* ── BODY ── */
  .body { display: flex; flex: 1; overflow: hidden; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-left: 1px solid var(--border-soft);
    display: flex; flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .sidebar::-webkit-scrollbar { width: 0; }
  .sidebar-title {
    font-size: 10px; font-weight: 600; letter-spacing: 1.5px;
    color: var(--text-muted); text-transform: uppercase;
    padding: 18px 16px 10px;
  }
  .cat-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 16px; border: none; background: transparent;
    cursor: pointer; font-family: var(--font); font-size: 14px;
    color: var(--text-dim); text-align: right;
    border-radius: 10px; margin: 1px 8px; width: calc(100% - 16px);
    transition: background .15s, color .15s;
  }
  .cat-btn:hover { background: var(--surface2); color: var(--text); }
  .cat-btn.active {
    background: linear-gradient(135deg, #FFF0E8, #FFE4D0);
    color: var(--accent); font-weight: 600;
    border: 1px solid #F0C4A8;
  }
  .cat-icon { font-size: 16px; flex-shrink: 0; }
  .sidebar-divider { height: 1px; background: var(--border-soft); margin: 8px 16px; }

  /* ── CHAT ── */
  .chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  .messages {
    flex: 1; overflow-y: auto;
    padding: 20px 20px 8px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 5px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── MESSAGES ── */
  .msg { display: flex; gap: 10px; animation: fadeUp .2s ease; max-width: 720px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  .msg.user { flex-direction: row-reverse; align-self: flex-start; }
  .msg.ai   { align-self: flex-end; }

  .msg-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; margin-top: 2px;
  }
  .msg.ai .msg-avatar {
    background: linear-gradient(135deg, var(--accent), #D4813A);
    box-shadow: 0 2px 6px rgba(184,92,56,.25);
  }
  .msg.user .msg-avatar { background: var(--surface2); font-size: 12px; font-weight: 700; color: var(--text-dim); }

  .bubble {
    padding: 12px 16px; border-radius: var(--radius);
    font-size: 15px; line-height: 1.7;
    max-width: calc(100% - 44px); word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--bubble-user); border: 1px solid var(--border-soft);
    border-top-right-radius: 4px; color: var(--text);
  }
  .msg.ai .bubble {
    background: var(--bubble-ai); border: 1px solid var(--border-soft);
    border-top-left-radius: 4px; box-shadow: var(--shadow); color: var(--text);
  }

  .bubble strong { font-weight: 700; color: var(--accent-dark); }
  .bubble em { font-style: italic; }
  .bubble p { margin-bottom: 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { padding-right: 20px; margin-bottom: 10px; }
  .bubble li { margin-bottom: 4px; }
  .bubble h3 { font-size: 15px; font-weight: 700; color: var(--accent-dark); margin-bottom: 8px; }
  .bubble .tip-box {
    margin-top: 12px; padding: 10px 14px;
    background: var(--green-bg); border-right: 3px solid var(--green);
    border-radius: 8px; font-size: 13.5px; color: #4A6B30;
  }

  .msg-time { font-size: 10px; color: var(--text-muted); margin-top: 4px; padding: 0 4px; }
  .msg.user .msg-time { text-align: right; }
  .msg.ai   .msg-time { text-align: left; }

  .tts-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 15px;
    padding: 3px 7px; border-radius: 8px; margin-top: 4px;
    transition: color .15s, background .15s;
    align-self: flex-start; line-height: 1;
  }
  .tts-btn:hover { color: var(--accent); background: var(--surface); }
  .tts-btn.speaking { color: var(--accent); background: var(--surface); animation: pulse-tts 1.2s infinite; }
  @keyframes pulse-tts { 0%,100% { opacity:1; } 50% { opacity:.5; } }

  .typing .bubble { padding: 14px 18px; }
  .dots { display: flex; gap: 5px; }
  .dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent-light); animation: dot 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 0%,80%,100% { transform: scale(.7); opacity:.5; } 40% { transform: scale(1); opacity:1; } }

  /* ── WELCOME ── */
  .welcome {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; flex: 1; padding: 40px 24px; text-align: center;
  }
  .welcome-icon { font-size: 52px; margin-bottom: 4px; }
  .welcome-title { font-size: 22px; font-weight: 700; color: var(--text); }
  .welcome-sub { font-size: 15px; color: var(--text-dim); line-height: 1.6; max-width: 380px; }
  .welcome-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  .welcome-chip {
    padding: 7px 15px; border-radius: 20px;
    background: var(--surface); border: 1px solid var(--border-soft);
    font-size: 13px; color: var(--text-dim); cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .welcome-chip:hover { background: var(--bubble-user); border-color: var(--border); color: var(--text); }

  /* ── INPUT ── */
  .input-wrap {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border-soft);
    background: var(--bg); flex-shrink: 0;
  }
  .cat-active-bar {
    display: none; align-items: center; gap: 8px;
    font-size: 12px; color: var(--accent); margin-bottom: 8px;
  }
  .cat-active-bar.visible { display: flex; }
  .cat-clear { cursor: pointer; font-size: 14px; color: var(--text-muted); line-height: 1; margin-right: auto; }
  .cat-clear:hover { color: var(--accent); }
  .input-row {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--surface); border: 1.5px solid var(--border-soft);
    border-radius: 14px; padding: 6px 6px 6px 10px;
    transition: border-color .2s;
  }
  .input-row:focus-within { border-color: var(--accent-light); }
  #user-input {
    flex: 1; min-width: 0; border: none; background: transparent;
    font-family: var(--font); font-size: 15px; color: var(--text);
    resize: none; outline: none; max-height: 120px; min-height: 28px;
    line-height: 1.5; padding: 4px 0; direction: rtl;
    overflow-y: hidden;
  }
  #user-input::placeholder { color: var(--text-muted); }
  .send-btn {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--accent); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background .15s, transform .1s;
  }
  .send-btn:hover { background: var(--accent-dark); }
  .send-btn:active { transform: scale(.95); }
  .send-btn svg { width: 18px; height: 18px; fill: white; }
  .send-btn:disabled { background: var(--surface2); cursor: default; }
  .send-btn:disabled svg { fill: var(--text-muted); }

  /* ── RESPONSIVE ── */
  @media (max-width: 640px) {
    :root { --sidebar-w: 0px; }
    .sidebar { display: none; }
    .mobile-cats {
      display: flex; overflow-x: auto; gap: 8px;
      padding: 10px 14px; border-bottom: 1px solid var(--border-soft); flex-shrink: 0;
    }
    .mobile-cats::-webkit-scrollbar { height: 0; }
    .mobile-cat-btn {
      white-space: nowrap; padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--border-soft); background: var(--surface);
      font-family: var(--font); font-size: 13px; color: var(--text-dim);
      cursor: pointer; flex-shrink: 0;
    }
    .mobile-cat-btn.active {
      background: linear-gradient(135deg, #FFF0E8, #FFE4D0);
      color: var(--accent); border-color: #F0C4A8; font-weight: 600;
    }
  }
  @media (min-width: 641px) { .mobile-cats { display: none; } }
</style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="header-avatar">🍳</div>
      <div>
        <div class="header-name">תמר במטבח</div>
        <div class="header-sub">עוזרת המטבח האישית שלך</div>
      </div>
    </div>
    <span class="kb-badge" id="kb-badge">📚 <span id="kb-size">0</span> KB</span>
  </header>

  <div class="body">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-title">קטגוריות</div>
      <button class="cat-btn active" data-cat="" onclick="selectCat(this)">
        <span class="cat-icon">🍽️</span> כל המתכונים
      </button>
      <button class="cat-btn" data-cat="בישול ארוך" onclick="selectCat(this)">
        <span class="cat-icon">🥘</span> בישול ארוך
      </button>
      <button class="cat-btn" data-cat="ארוחת ערב קלילה" onclick="selectCat(this)">
        <span class="cat-icon">🌙</span> ארוחת ערב קלילה
      </button>
      <button class="cat-btn" data-cat="אפייה" onclick="selectCat(this)">
        <span class="cat-icon">🥐</span> אפייה
      </button>
      <button class="cat-btn" data-cat="מרקים ותבשילים" onclick="selectCat(this)">
        <span class="cat-icon">🍲</span> מרקים ותבשילים
      </button>
      <div class="sidebar-divider"></div>
      <button class="cat-btn" data-cat="ארוחות בוקר" onclick="selectCat(this)">
        <span class="cat-icon">☀️</span> ארוחות בוקר
      </button>
      <button class="cat-btn" data-cat="קינוחים" onclick="selectCat(this)">
        <span class="cat-icon">🍰</span> קינוחים
      </button>
      <button class="cat-btn" data-cat="צמחוני וטבעוני" onclick="selectCat(this)">
        <span class="cat-icon">🥗</span> צמחוני / טבעוני
      </button>
      <button class="cat-btn" data-cat="חגים ושבת" onclick="selectCat(this)">
        <span class="cat-icon">✨</span> חגים ושבת
      </button>
      <button class="cat-btn" data-cat="פסטות ואורז" onclick="selectCat(this)">
        <span class="cat-icon">🍝</span> פסטות ואורז
      </button>
      <button class="cat-btn" data-cat="סלטים" onclick="selectCat(this)">
        <span class="cat-icon">🥙</span> סלטים וממרחים
      </button>
    </aside>

    <!-- CHAT -->
    <section class="chat">
      <div class="mobile-cats" id="mobile-cats"></div>

      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">🍳</div>
          <div class="welcome-title">שלום, אני תמר!</div>
          <div class="welcome-sub">אני כאן לעזור לך במטבח — מתכונים, כמויות, טיפים, ועצות לכל סיטואציה. מה נבשל היום?</div>
          <div class="welcome-chips">
            <span class="welcome-chip" onclick="sendQuick('מה אפשר להכין לארוחת ערב מהירה?')">ארוחת ערב מהירה</span>
            <span class="welcome-chip" onclick="sendQuick('תני לי מתכון לעוגת שוקולד פשוטה')">עוגת שוקולד</span>
            <span class="welcome-chip" onclick="sendQuick('איך מבשלים עוף בתנור רך ועסיסי?')">עוף בתנור</span>
            <span class="welcome-chip" onclick="sendQuick('מרק עגבניות ביתי — מתכון פשוט')">מרק עגבניות</span>
            <span class="welcome-chip" onclick="sendQuick('מה אפשר לאפות לשבת?')">אפייה לשבת</span>
          </div>
        </div>
      </div>

      <div class="input-wrap">
        <div class="cat-active-bar" id="cat-active-bar">
          <span>🏷️</span>
          <span id="cat-active-label"></span>
          <span class="cat-clear" onclick="clearCat()" title="הסירי סינון">✕</span>
        </div>
        <div class="input-row">
          <textarea id="user-input" rows="1"
            placeholder="שאלי אותי על מתכון, כמות, טיפ…"
            onkeydown="handleKey(event)"
            oninput="autoResize(this)"></textarea>
          <button class="send-btn" id="send-btn" onclick="sendMessage()" title="שלחי">
            <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2v7z"/></svg>
          </button>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
const SERVER_URL = window.location.origin;

const CATEGORIES = [
  { icon: '🍽️', label: 'כל המתכונים', cat: '' },
  { icon: '🥘', label: 'בישול ארוך',        cat: 'בישול ארוך' },
  { icon: '🌙', label: 'ארוחת ערב קלילה',   cat: 'ארוחת ערב קלילה' },
  { icon: '🥐', label: 'אפייה',              cat: 'אפייה' },
  { icon: '🍲', label: 'מרקים ותבשילים',    cat: 'מרקים ותבשילים' },
  { icon: '☀️', label: 'ארוחות בוקר',       cat: 'ארוחות בוקר' },
  { icon: '🍰', label: 'קינוחים',            cat: 'קינוחים' },
  { icon: '🥗', label: 'צמחוני / טבעוני',   cat: 'צמחוני וטבעוני' },
  { icon: '✨', label: 'חגים ושבת',          cat: 'חגים ושבת' },
  { icon: '🍝', label: 'פסטות ואורז',        cat: 'פסטות ואורז' },
  { icon: '🥙', label: 'סלטים וממרחים',     cat: 'סלטים' },
];

let messages   = [];
let currentCat = '';
let isLoading  = false;

// ── Mobile categories ──
function buildMobileCats() {
  const container = document.getElementById('mobile-cats');
  CATEGORIES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'mobile-cat-btn' + (c.cat === currentCat ? ' active' : '');
    btn.textContent = c.icon + ' ' + c.label;
    btn.onclick = () => {
      currentCat = c.cat;
      document.querySelectorAll('.mobile-cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateCatBar();
    };
    container.appendChild(btn);
  });
}

function selectCat(el) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  currentCat = el.dataset.cat;
  updateCatBar();
}

function updateCatBar() {
  const bar = document.getElementById('cat-active-bar');
  document.getElementById('cat-active-label').textContent = currentCat;
  bar.classList.toggle('visible', !!currentCat);
}

function clearCat() {
  currentCat = '';
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.cat-btn[data-cat=""]').classList.add('active');
  document.querySelectorAll('.mobile-cat-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
  updateCatBar();
}

// ── Messaging ──
function sendQuick(text) {
  document.getElementById('user-input').value = text;
  sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = '1px';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const text  = input.value.trim();
  if (!text || isLoading) return;

  hideWelcome();
  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  setSendDisabled(true);

  appendMsg('user', text);
  messages.push({ role: 'user', content: text });
  const typingEl = appendTyping();

  try {
    const res  = await fetch(`${SERVER_URL}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, category: currentCat })
    });
    const data = await res.json();
    typingEl.remove();

    if (data.reply) {
      appendMsg('ai', data.reply);
      messages.push({ role: 'assistant', content: data.reply });
    } else {
      appendMsg('ai', '😕 משהו השתבש. נסי שוב.');
    }
  } catch {
    typingEl.remove();
    appendMsg('ai', '⚠️ לא הצלחתי להתחבר לשרת. ודאי שהשרת פועל.');
  }

  isLoading = false;
  setSendDisabled(false);
  input.focus();
}

function appendMsg(role, text) {
  const container = document.getElementById('messages');
  const el     = document.createElement('div');
  el.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className   = 'msg-avatar';
  avatar.textContent = role === 'ai' ? '🍳' : '👤';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML  = formatText(text);

  const time = document.createElement('div');
  time.className   = 'msg-time';
  time.textContent = new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });

  const inner = document.createElement('div');
  inner.style.cssText = 'display:flex;flex-direction:column';
  inner.appendChild(bubble);
  inner.appendChild(time);

  if (role === 'ai') {
    const ttsBtn = document.createElement('button');
    ttsBtn.className   = 'tts-btn';
    ttsBtn.textContent = '🔈';
    ttsBtn.title       = 'האזיני לתשובה';
    ttsBtn.onclick     = () => ttsSpeak(text, ttsBtn);
    inner.appendChild(ttsBtn);
  }

  el.appendChild(avatar);
  el.appendChild(inner);
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
  return el;
}

function appendTyping() {
  const container = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg ai typing';

  const avatar = document.createElement('div');
  avatar.className   = 'msg-avatar';
  avatar.textContent = '🍳';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML  = '<div class="dots"><span></span><span></span><span></span></div>';

  el.appendChild(avatar);
  el.appendChild(bubble);
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
  return el;
}

function formatText(raw) {
  let t = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/<strong>טיפ של תמר:<\/strong>(.*?)(\n|$)/g,
      '<div class="tip-box">💡 <strong>טיפ של תמר:</strong>$1</div>');
  t = t.replace(/\*(.*?)\*/g, '<em>$1</em>');
  t = t.replace(/^[•\-] (.+)$/gm, '<li>$1</li>');
  t = t.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
  t = t.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  t = t.replace(/^#{2,3} (.+)$/gm, '<h3>$1</h3>');

  t = t.split(/\n{2,}/).map(p => {
    p = p.trim();
    if (!p) return '';
    if (p.startsWith('<')) return p;
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).join('');

  return t;
}

function hideWelcome() {
  const w = document.getElementById('welcome');
  if (w) w.remove();
}

function setSendDisabled(v) {
  document.getElementById('send-btn').disabled = v;
}

// ── TTS ──
let ttsActiveBtn = null;

function ttsStrip(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '$1')
    .replace(/\*(.*?)\*/g, '$1')
    .replace(/^#{2,3} (.+)$/gm, '$1')
    .replace(/^[•\-] /gm, '')
    .replace(/^\d+\. /gm, '')
    .replace(/\n{2,}/g, '. ')
    .replace(/\n/g, ' ')
    .trim();
}

function ttsSpeak(text, btn) {
  if (!window.speechSynthesis) return;

  if (btn.classList.contains('speaking')) {
    window.speechSynthesis.cancel();
    btn.classList.remove('speaking');
    btn.textContent = '🔈';
    ttsActiveBtn = null;
    return;
  }

  if (ttsActiveBtn) {
    window.speechSynthesis.cancel();
    ttsActiveBtn.classList.remove('speaking');
    ttsActiveBtn.textContent = '🔈';
    ttsActiveBtn = null;
  }

  const doSpeak = () => {
    window.speechSynthesis.cancel();
    if (window.speechSynthesis.paused) window.speechSynthesis.resume();

    const utt = new SpeechSynthesisUtterance(ttsStrip(text));
    utt.lang  = 'he-IL';
    utt.rate  = 0.9;
    utt.pitch = 1.05;

    const voices  = window.speechSynthesis.getVoices();
    const heVoice = voices.find(v => v.lang && v.lang.startsWith('he'));
    if (heVoice) utt.voice = heVoice;

    utt.onend = () => {
      btn.classList.remove('speaking');
      btn.textContent = '🔈';
      ttsActiveBtn = null;
    };
    utt.onerror = (e) => {
      console.warn('TTS error:', e.error);
      btn.classList.remove('speaking');
      btn.textContent = '🔈';
      ttsActiveBtn = null;
    };

    btn.classList.add('speaking');
    btn.textContent = '⏹️';
    ttsActiveBtn = btn;
    window.speechSynthesis.speak(utt);
  };

  const voices = window.speechSynthesis.getVoices();
  if (voices.length > 0) {
    doSpeak();
  } else {
    window.speechSynthesis.addEventListener('voiceschanged', function once() {
      window.speechSynthesis.removeEventListener('voiceschanged', once);
      doSpeak();
    });
    setTimeout(() => { if (!btn.classList.contains('speaking')) doSpeak(); }, 1000);
  }
}
